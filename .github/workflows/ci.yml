name: CI
on: [push, pull_request]
jobs:
  tp1:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }          # tout l'historique : git shortlog compte les deux auteurs
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Environnement virtuel et dépendances
        run: python -m venv .venv && . .venv/bin/activate && pip install pandas "scikit-learn==1.5.*" pytest "fastapi==0.115.*" "httpx==0.27.*" "uvicorn==0.30.*" "streamlit==1.39.*"
      - name: Diagnostic
        run: . .venv/bin/activate && python scripts/check_setup.py
      - name: Modèle de démonstration, pour les tests de l'API (TP3)
        run: . .venv/bin/activate && python src/make_demo.py && python src/train.py
      - name: Outils de qualité (TP4)
        run: . .venv/bin/activate && pip install -r requirements-dev.txt
      - name: ruff
        run: . .venv/bin/activate && ruff check .
      - name: mypy
        run: . .venv/bin/activate && mypy api
      - name: Tests et couverture
        run: . .venv/bin/activate && pytest -q --cov=api --cov-report=term-missing --cov-fail-under=95
      - name: Roue installée hors du dépôt (TP6)
        run: |
          . .venv/bin/activate && python -m build --wheel
          python -m venv /tmp/roue && /tmp/roue/bin/pip install dist/*.whl
          cd /tmp && SENTIMENT_MODELE="$GITHUB_WORKSPACE/models/sentiment.joblib" /tmp/roue/bin/sentiment predict "Livraison rapide, produit conforme, très satisfait"
